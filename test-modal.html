<!DOCTYPE html>
<html>
<head>
  <title>Modal Test</title>
  <style>
    .modal-test {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background-color: rgba(0, 0, 0, 0.9) !important;
      z-index: 2147483647 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .modal-card-test {
      background: white !important;
      padding: 40px !important;
      border-radius: 20px !important;
      max-width: 600px !important;
      width: 90% !important;
    }
  </style>
</head>
<body>
  <button onclick="document.getElementById('modal').style.display='flex'">Open Modal</button>
  <div id="modal" class="modal-test" style="display:none;" onclick="this.style.display='none'">
    <div class="modal-card-test" onclick="event.stopPropagation()">
      <h2>Test Modal</h2>
      <p>If you can see this, the modal works!</p>
      <button onclick="document.getElementById('modal').style.display='none'">Close</button>
    </div>
  </div>
</body>
</html>
